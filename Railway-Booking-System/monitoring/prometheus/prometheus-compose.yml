# =============================================================================
# Railora Prometheus Configuration for Unified Docker Compose (Phase 17.2)
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts/*.yml"

scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: "prometheus"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
          environment: "production"

  # 2. Railora Application Actuator Metrics (Internal Compose Network)
  - job_name: "railora"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 15s
    scrape_timeout: 10s
    # HTTP Basic authentication matching Railora's MetricsSecurityConfig
    # Password loaded from mounted secret file (no hardcoded credentials)
    basic_auth:
      username: "promuser"
      password_file: "/etc/prometheus/secrets/metrics_password"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: "railora"
          environment: "production"
          app: "railway-booking"
