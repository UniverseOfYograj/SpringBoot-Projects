spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${RAZORPAY_E2E_DB_URL}
spring.datasource.username=${RAZORPAY_E2E_DB_USERNAME}
spring.datasource.password=${RAZORPAY_E2E_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}

razorpay.enabled=${RAZORPAY_ENABLED:false}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
railway.payment.mock-enabled=false
railway.payment.simulated-enabled=${RAILWAY_PAYMENT_SIMULATED_ENABLED:true}

railway.fare.base-amount=${RAILWAY_BASE_FARE:500.00}
railway.cache.enabled=false
railway.data-seed.admin.enabled=false
railway.data-seed.journey.enabled=false
railway.outbox.kafka.enabled=false
railway.outbox.scheduler.enabled=false
