spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
railway.outbox.kafka.enabled=${RAILWAY_OUTBOX_KAFKA_ENABLED:false}

server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

railway.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

razorpay.enabled=${RAZORPAY_ENABLED:false}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
railway.payment.mock-enabled=false
railway.payment.simulated-enabled=${RAILWAY_PAYMENT_SIMULATED_ENABLED:true}

# Production must explicitly configure the server-side fixed booking fare.
railway.fare.base-amount=${RAILWAY_BASE_FARE}

# Production Structured JSON Logging (Phase 15B)
logging.structured.format.console=logstash

# Dedicated Metrics Scrape Authentication (Phase 15C / Phase 17.2)
# When external Prometheus scraping is deferred, defaults safely to false (endpoint protected by ROLE_ADMIN)
management.metrics.scrape.auth.enabled=${METRICS_SCRAPE_AUTH_ENABLED:false}

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.endpoint.health.group.cache.include=redis
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true
