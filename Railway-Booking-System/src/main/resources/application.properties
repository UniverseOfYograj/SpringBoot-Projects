spring.application.name=railway_booking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

jwt.access-secret=${JWT_ACCESS_SECRET:}
jwt.refresh-secret=${JWT_REFRESH_SECRET:}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/railway_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

railradar.base-url=${RAILRADAR_BASE_URL:https://api.railradar.in/v1}
railradar.api-key=${RAILRADAR_API_KEY:}

# Scheduled Seat Hold Reaper Configuration
railway.seat-hold-reaper.enabled=${SEAT_HOLD_REAPER_ENABLED:true}
railway.seat-hold-reaper.fixed-delay-ms=${SEAT_HOLD_REAPER_FIXED_DELAY_MS:30000}
railway.seat-hold-reaper.initial-delay-ms=${SEAT_HOLD_REAPER_INITIAL_DELAY_MS:10000}
railway.seat-hold-reaper.batch-size=${SEAT_HOLD_REAPER_BATCH_SIZE:50}

# Data Seeding (Opt-in; disabled by default to protect live database data)
railway.data-seed.admin.enabled=${SEED_ADMIN_USER_ENABLED:false}
railway.data-seed.journey.enabled=${SEED_JOURNEY_DATA_ENABLED:false}

# Transactional Outbox Kafka Publisher Configuration
# Defaulted to false for local development without requiring a live Kafka broker.
railway.outbox.kafka.enabled=${RAILWAY_OUTBOX_KAFKA_ENABLED:false}
railway.outbox.kafka.topic=${RAILWAY_OUTBOX_KAFKA_TOPIC:railora-booking-events}
railway.outbox.kafka.timeout-ms=${RAILWAY_OUTBOX_KAFKA_TIMEOUT_MS:5000}

# Outbox Background Polling Scheduler (active only when railway.outbox.kafka.enabled=true)
railway.outbox.scheduler.enabled=${RAILWAY_OUTBOX_SCHEDULER_ENABLED:true}
railway.outbox.scheduler.fixed-delay-ms=${RAILWAY_OUTBOX_SCHEDULER_FIXED_DELAY_MS:5000}
railway.outbox.scheduler.initial-delay-ms=${RAILWAY_OUTBOX_SCHEDULER_INITIAL_DELAY_MS:5000}
railway.outbox.scheduler.batch-size=${RAILWAY_OUTBOX_SCHEDULER_BATCH_SIZE:50}
railway.outbox.scheduler.claim-timeout-ms=${RAILWAY_OUTBOX_SCHEDULER_CLAIM_TIMEOUT_MS:60000}

# Spring Kafka Producer Defaults (active when Kafka is enabled)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all


# Resilient Redis Caching for Journey and Train Search
railway.cache.enabled=${RAILWAY_CACHE_ENABLED:true}
railway.cache.journey-search.ttl-minutes=${RAILWAY_CACHE_JOURNEY_SEARCH_TTL_MINUTES:10}
railway.cache.train-search.ttl-minutes=${RAILWAY_CACHE_TRAIN_SEARCH_TTL_MINUTES:30}
railway.cache.topology.ttl-hours=${RAILWAY_CACHE_TOPOLOGY_TTL_HOURS:24}

# Spring Data Redis Connection Configuration (supports managed Upstash / local Redis)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000ms}

# Razorpay remains opt-in. MOCK_UPI is for local development and tests only.
razorpay.enabled=${RAZORPAY_ENABLED:false}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
railway.payment.mock-enabled=true
railway.payment.simulated-enabled=${RAILWAY_PAYMENT_SIMULATED_ENABLED:true}

# Flat fare applies to each booking until reliable route-distance and tariff data are available.
railway.fare.base-amount=${RAILWAY_BASE_FARE:500.00}

# ==========================================
# Logging Configuration (Phase 15B)
# ==========================================
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] [%X{correlationId:-}] %logger{36} - %m%n

# ==========================================
# Actuator, Health Probes & Metrics (Phase 15A)
# ==========================================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true

# Liveness: verifies application process is running (excludes external dependencies)
management.endpoint.health.group.liveness.include=livenessState

# Readiness: verifies core booking dependencies are ready (PostgreSQL, disk space)
# Optional Redis cache is decoupled from readiness to preserve fail-open behavior
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace

# Optional Cache group: allows operators to independently observe Redis connectivity
management.endpoint.health.group.cache.include=redis

# Prometheus Metrics
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true

# ==========================================
# HikariCP Database Connection Pool (Phase 15A)
# ==========================================
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME:RailoraHikariPool}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD_MS:20000}

# ==========================================
# Metrics Scrape Authentication (Phase 15C)
# ==========================================
# Disabled by default. Enable for Prometheus scraping with HTTP Basic Auth.
# Requires METRICS_USER and METRICS_PASSWORD environment variables when enabled.
management.metrics.scrape.auth.enabled=${METRICS_SCRAPE_AUTH_ENABLED:false}
