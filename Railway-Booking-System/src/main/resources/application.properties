spring.application.name=railway_booking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

jwt.access-secret=${JWT_ACCESS_SECRET:}
jwt.refresh-secret=${JWT_REFRESH_SECRET:}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/railway_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

railradar.base-url=${RAILRADAR_BASE_URL:https://api.railradar.in/v1}
railradar.api-key=${RAILRADAR_API_KEY:}

# Scheduled Seat Hold Reaper Configuration
railway.seat-hold-reaper.enabled=${SEAT_HOLD_REAPER_ENABLED:true}
railway.seat-hold-reaper.fixed-delay-ms=${SEAT_HOLD_REAPER_FIXED_DELAY_MS:30000}
railway.seat-hold-reaper.initial-delay-ms=${SEAT_HOLD_REAPER_INITIAL_DELAY_MS:10000}
railway.seat-hold-reaper.batch-size=${SEAT_HOLD_REAPER_BATCH_SIZE:50}

# Data Seeding (Opt-in; disabled by default to protect live database data)
railway.data-seed.admin.enabled=${SEED_ADMIN_USER_ENABLED:false}
railway.data-seed.journey.enabled=${SEED_JOURNEY_DATA_ENABLED:false}
