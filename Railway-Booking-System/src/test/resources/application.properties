spring.application.name=railway_booking-test

# Test JWT Secrets (>= 32 bytes for HMAC-SHA)
jwt.access-secret=test-access-signing-secret-with-minimum-32-bytes-length
jwt.refresh-secret=test-refresh-signing-secret-with-minimum-32-bytes-length
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000

# Test Database Configuration
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:railway_booking_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Test bookings use the same deterministic default fare as local development.
railway.fare.base-amount=500.00
railway.payment.mock-enabled=true
railway.payment.simulated-enabled=true

# Test Integration Defaults
railradar.base-url=https://api.railradar.in/v1
railradar.api-key=test-api-key

# Test Scheduled Seat Hold Reaper Configuration (disabled by default in general tests to avoid background timer noise)
railway.seat-hold-reaper.enabled=false
railway.seat-hold-reaper.fixed-delay-ms=30000
railway.seat-hold-reaper.initial-delay-ms=10000
railway.seat-hold-reaper.batch-size=50

# Test Redis Caching Defaults
railway.cache.enabled=true
railway.cache.journey-search.ttl-minutes=10
railway.cache.train-search.ttl-minutes=30
railway.cache.topology.ttl-hours=24

# Test Redis Connection Defaults
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:5000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5000ms}

# Test Logging Configuration (Phase 15B)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%t] [%X{correlationId:-}] %logger{36} - %m%n

# Test Actuator, Health Probes & Metrics (Phase 15A)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,diskSpace
management.endpoint.health.group.cache.include=redis
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true

# Test HikariCP Database Connection Pool Defaults (Phase 15A)
spring.datasource.hikari.pool-name=${HIKARI_POOL_NAME:RailoraHikariPool}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1200000}
spring.datasource.hikari.leak-detection-threshold=${HIKARI_LEAK_DETECTION_THRESHOLD_MS:20000}
