name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile backend
        run: bash ./mvnw -B -DskipTests package
      - name: Run focused backend tests
        run: bash ./mvnw -B -Dtest=AuthTokenRoleTests,SecurityHardeningIntegrationTests,JwtSecretConfigurationTests,TransactionalOutboxLifecycleTests test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: railora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: railora/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
