# =============================================================================
# Railora — Unified Production Docker Compose Architecture (Phase 17.2)
# Orchestrates: PostgreSQL 16, Redis 7, Spring Boot, Nginx, Prometheus, Grafana
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Relational Database (with btree_gist extension via Flyway)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-railora}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-railway_booking_prod}
      POSTGRES_USER: ${POSTGRES_USER:-railora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-railora_user} -d $${POSTGRES_DB:-railway_booking_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - railora-prod-net

  # ---------------------------------------------------------------------------
  # 2. Redis High-Speed Cache & Tatkal Queue Store (AOF Persistence)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-railora}-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be configured in environment}
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be configured in environment}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - railora-prod-net

  # ---------------------------------------------------------------------------
  # 3. Spring Boot Backend Engine (Java 21 / Spring Boot 3.3.5)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: railora-backend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-railora}-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-railway_booking_prod}
      DB_USERNAME: ${POSTGRES_USER:-railora_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be configured in environment}
      REDIS_SSL_ENABLED: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be configured in environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be configured in environment}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1}
      RAILWAY_BASE_FARE: ${RAILWAY_BASE_FARE:-500.00}
      RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAILWAY_PAYMENT_SIMULATED_ENABLED: "false"
      RAILWAY_PAYMENT_MOCK_ENABLED: "false"
      RAILWAY_OUTBOX_KAFKA_ENABLED: ${RAILWAY_OUTBOX_KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      SEED_ADMIN_USER_ENABLED: "false"
      SEED_JOURNEY_DATA_ENABLED: "false"
      METRICS_SCRAPE_AUTH_ENABLED: ${METRICS_SCRAPE_AUTH_ENABLED:-true}
      METRICS_USER: ${METRICS_USER:-promuser}
      METRICS_PASSWORD: ${METRICS_PASSWORD:?METRICS_PASSWORD must be configured in environment}
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/livez || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - railora-prod-net

  # ---------------------------------------------------------------------------
  # 4. React Single Page Application Frontend (Nginx Reverse Proxy)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./railora
      dockerfile: Dockerfile
    image: railora-frontend:latest
    container_name: ${COMPOSE_PROJECT_NAME:-railora}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/livez || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - railora-prod-net

  # ---------------------------------------------------------------------------
  # 5. Prometheus Observability Engine (Scrapes Internal Backend)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-railora}-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - ${METRICS_PASSWORD_FILE:-./monitoring/secrets/metrics_password}:/etc/prometheus/secrets/metrics_password:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - railora-prod-net

  # ---------------------------------------------------------------------------
  # 6. Grafana Operational Dashboards (Auto-Provisioned)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: ${COMPOSE_PROJECT_NAME:-railora}-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be configured in environment}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - railora-prod-net

# -----------------------------------------------------------------------------
# Named Volumes & Bridge Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-railora}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-railora}_redis_data
  prometheus_data:
    name: ${COMPOSE_PROJECT_NAME:-railora}_prometheus_data
  grafana_data:
    name: ${COMPOSE_PROJECT_NAME:-railora}_grafana_data

networks:
  railora-prod-net:
    name: ${COMPOSE_PROJECT_NAME:-railora}-network
    driver: bridge
